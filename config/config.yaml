spark:
  app_name: "ETL Pipeline"
  
catalog:
  name: ${CATALOG_NAME}
  schema: ${SCHEMA_NAME}
  
tables:
  source: "ventas_raw"
  target: "ventas_transformed"
  
business_rules:
  order_size:
    large_threshold: 10
    medium_threshold: 5
  price_category:
    premium_threshold: 500
    standard_threshold: 100
    
data_quality:
  max_null_percentage: 5
  check_duplicates: true
  validate_negative_values: true
